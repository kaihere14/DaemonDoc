name: daemondoc-api-server
services:
  redis:
    image: redis:7-alpine
    container_name: daemondoc-redis
    restart: unless-stopped
    networks:
      - daemondoc-api-network
    ports:
      - "6379:6379"
    volumes:
      - daemondoc-redis-data:/data

 
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - daemondoc-api-network

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - daemondoc-api-network
       
networks:
  daemondoc-api-network:
    name: daemondoc-api-network
    driver: bridge

volumes:
  daemondoc-redis-data:
    name: daemondoc-redis-data